#
# The page's two questions. errors:no on each: both print a JSON answer and exit 0, and this keeps
# the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/fallbackcrypto/status.py
parameters:
errors:no
type:script_output
message:reading the host's crypto providers

# ossl loaded now and the loader tunable written, as the setting says.
[apply]
command:/usr/local/opnsense/scripts/fallbackcrypto/apply.php
parameters:
errors:no
type:script_output
message:applying the crypto provider for IPsec
